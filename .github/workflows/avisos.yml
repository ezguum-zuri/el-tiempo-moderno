name: Actualizar avisos de AEMET

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar avisos vigentes
        run: python scripts/avisos.py avisos.json
      - name: Guardar si han cambiado
        run: |
          # "updated" cambia siempre; solo se guarda si cambia la lista de avisos o si el archivo tiene más de 3 horas
          if git diff --quiet -- avisos.json 2>/dev/null && git ls-files --error-unmatch avisos.json >/dev/null 2>&1; then exit 0; fi
          changed=$(python - <<'PY'
          import json,subprocess,datetime
          new=json.load(open('avisos.json'))
          try:
              old=json.loads(subprocess.run(['git','show','HEAD:avisos.json'],capture_output=True,text=True,check=True).stdout)
          except Exception:
              print('yes');raise SystemExit
          age=datetime.datetime.fromisoformat(new['updated'])-datetime.datetime.fromisoformat(old['updated'])
          print('yes' if new['warnings']!=old['warnings'] or age.total_seconds()>3*3600 else 'no')
          PY
          )
          if [ "$changed" != "yes" ]; then git checkout -- avisos.json; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add avisos.json
          git commit -m "Avisos AEMET actualizados"
          git push
