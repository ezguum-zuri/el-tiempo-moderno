<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isla del tiempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: juguetón pero preciso, como un juguete de diseño que además te dice si llevar paraguas
   IDEA: una isla flotante de arcilla con un caserío; el cielo de encima ES la previsión
   PICTURE: diorama SVG que cambia con la hora que eliges (sol, luna, nubes, lluvia, nieve, rayos, niebla)
   COLOUR and TYPE: tres pieles (Arcilla, Noche, Verbena); Anton para las cifras, Archivo para texto, Mono para datos
   LAYOUT: isla + temperatura arriba, lector hora a hora al lado, semana y fichas debajo */
:root{color-scheme:light dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:150px}
body{margin:0;font:18px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip;background:var(--bg);color:var(--ink);transition:background .4s,color .4s}
body,body[data-skin=arcilla]{--bg:#ebe8e2;--card:#f8f6f2;--ink:#151515;--mute:#6b6862;--line:#d8d3ca;--acc:#e8432e;--sun:#f7b500;--roof:#b23a2a;--c1:#5a5a5a;--c2:#0d0d0d;--top:#93b26c;--side:#6f5a44;--rock1:#2b2623;--rock2:#0b0a09;--drop:#2f9bea;--warn:#f2a93b;--leaf:#3f7d4a;--house:#fdfcf9;--moon:#e9e6df}
body[data-skin=noche]{--bg:#0f1013;--card:#1a1b20;--ink:#f1f0ec;--mute:#9b998f;--line:#2e2f35;--acc:#ffb23e;--sun:#ffc83d;--roof:#a8463a;--c1:#f4f4f6;--c2:#8d909a;--top:#3d5c47;--side:#3b3129;--rock1:#3a3632;--rock2:#121110;--drop:#5cc2ff;--warn:#ffb23e;--leaf:#2f6b45;--house:#e9e4d8;--moon:#f3efe4;color-scheme:dark}
body[data-skin=verbena]{--bg:#f1e6d6;--card:#fbf4ea;--ink:#1d2457;--mute:#6a6987;--line:#e2d4bf;--acc:#f59a23;--sun:#ffc21a;--roof:#e0503f;--c1:#8fb2f5;--c2:#2d5ad0;--top:#9fcb6c;--side:#c27a4a;--rock1:#8a4b2d;--rock2:#4a2214;--drop:#2d5ad0;--warn:#ff5d73;--leaf:#4f9a52;--house:#fffaf2;--moon:#fff3d6;color-scheme:light}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(14px,3vw,36px) max(4vw,14px) 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.place{all:unset;cursor:pointer;font:800 clamp(28px,5vw,44px)/1.05 Archivo,sans-serif;display:flex;align-items:center;gap:10px;border-radius:12px;padding:4px 6px;margin-left:-6px}
.place:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.place svg{width:22px;height:22px;opacity:.6}
.mini{all:unset;box-sizing:border-box;position:fixed;z-index:50;left:50%;top:0;width:min(680px,calc(100% - 16px));margin-top:max(8px,env(safe-area-inset-top));
  transform:translate(-50%,-140%);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 14px;padding:12px 20px 12px 14px;border-radius:28px;cursor:pointer;
  background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:0 10px 30px #0003,0 0 0 1.5px var(--line);color:var(--ink);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.mini.on{transform:translate(-50%,0)}
.mini:focus-visible{outline:3px solid var(--acc)}
.mi-ic svg{width:60px;height:52px;display:block}
.mi-tx{display:grid;line-height:1.15;gap:2px}
.mi-tx b{font:800 24px Archivo,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi-tx small{font:400 21px/1.05 Anton,Impact,sans-serif;text-transform:uppercase;color:var(--ink);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi-t{font:400 58px/.9 Anton,Impact,sans-serif}
.mi-al{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:16px;font:600 16px/1.25 'JetBrains Mono',monospace;background:var(--warn);color:#1a1300}
.mi-al[hidden]{display:none}
.mi-al.lv2{background:#f5c400}.mi-al.lv3{background:#ff7a00}.mi-al.lv4{background:#e0281e;color:#fff}
.mi-al.ghost{background:transparent;color:var(--ink);border:1.5px dashed var(--mute);font-weight:400}
.mi-al svg{flex:none}
.mi-al span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media(max-width:600px){.mi-t{font-size:50px}.mi-tx b{font-size:22px}.mi-ic svg{width:52px;height:46px}}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding:max(14px,env(safe-area-inset-top)) max(4vw,14px) max(24px,env(safe-area-inset-bottom))}
.sheet[hidden]{display:none}
.sh-in{max-width:760px;margin:0 auto}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.sh-top h2{font:800 clamp(32px,7vw,44px)/1.05 Archivo,sans-serif;margin:0}
.sh-btns{display:flex;gap:8px}
.sh-h3{font:800 20px Archivo,sans-serif;margin:28px 0 10px}
.addf{display:flex;gap:8px}
.addf input{flex:1;font:18px Archivo,sans-serif;min-height:48px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.cards{display:grid;gap:14px;margin-top:16px}
.pc{position:relative}
.pcard{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:18px 22px 18px;border-radius:30px;background:var(--tint,var(--card));color:var(--ink);transition:transform .15s}
.pcard:active{transform:scale(.98)}
.pcard:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pc.cur .pcard{box-shadow:0 0 0 3px var(--ink)}
.pc-n{font:800 26px/1.1 Archivo,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-s{font:600 15px 'JetBrains Mono',monospace;color:var(--mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pc-t{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:6px;font:400 66px/.9 Anton,Impact,sans-serif}
.pc-t svg{width:54px;height:46px}
.pc-c{font:400 21px/1.1 Anton,Impact,sans-serif;text-transform:uppercase;margin-top:14px}
.pc-h{font:600 16px 'JetBrains Mono',monospace;margin-top:14px;text-align:right;white-space:nowrap}
.pc-a{grid-column:1/-1;margin-top:10px;padding:8px 12px;border-radius:14px;font:600 14px/1.25 'JetBrains Mono',monospace;color:#1a1300}
.pc-a.lv4{color:#fff}
.pc-ed{position:absolute;top:10px;right:10px;display:none;gap:6px}
.editing .pc-ed{display:flex}
.editing .pc-t{visibility:hidden}
.pc-ed button{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:800 18px Archivo,sans-serif}
.pc-ed button.del{background:#e0281e;color:#fff}
.pc-ed button:focus-visible{outline:3px solid var(--acc)}
.addhere{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.locbtn,.locbtn2{display:inline-flex;align-items:center;gap:8px}.locbtn2{margin-right:auto}
.locmsg{flex-basis:100%;order:9;margin:0;color:var(--mute);font-size:16px}.locmsg:empty{display:none}
.skins{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:600 16px Archivo,sans-serif;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--card);border-radius:24px;padding:16px;margin-bottom:18px;border:1.5px solid var(--line)}
.panel form{display:flex;gap:8px;flex-wrap:wrap}
.panel input{flex:1 1 220px;font:18px Archivo,sans-serif;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.msg{color:var(--mute);font-size:16px;margin:10px 4px 0}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
.card{background:var(--card);border-radius:32px;padding:clamp(18px,2.4vw,28px);position:relative;overflow:hidden}
.hero{display:flex;flex-direction:column}
.htop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.temp{font:400 clamp(92px,16vw,156px)/.9 Anton,Impact,sans-serif;letter-spacing:-.01em}
.temp sup{font-size:.4em;vertical-align:.95em;margin-left:2px}
.cond{text-align:right;max-width:15em}
.cond b{display:block;font:400 clamp(28px,3.8vw,38px)/1.05 Anton,Impact,sans-serif;text-transform:uppercase;text-wrap:balance}
.cond span{color:var(--mute);font-size:17px}
.when{font:600 15px 'JetBrains Mono',monospace;color:var(--mute);margin-top:6px}
.scene{width:100%;aspect-ratio:400/352;max-height:440px;cursor:pointer;margin-top:4px;-webkit-tap-highlight-color:transparent}
.bubble{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);background:var(--ink);color:var(--bg);font-weight:800;padding:8px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
.bubble.on{opacity:1;transform:translate(-50%,-90%) scale(1)}
.alerts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.alert{background:var(--warn);color:#1a1300;font:600 16px 'JetBrains Mono',monospace;padding:9px 16px;border-radius:999px;display:flex;gap:8px;align-items:center}
.alert.ghost{background:transparent;color:var(--ink);border:1.5px dashed var(--mute);font-weight:400}
.alert.lv2{background:#f5c400}.alert.lv3{background:#ff7a00}.alert.lv4{background:#e0281e;color:#fff}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.shead p{margin:4px 0 0;color:var(--mute);font-size:16px}
.alist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.alist li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding:14px 16px;border-radius:20px;background:var(--bg)}
.alist li>span{width:14px;border-radius:7px}
.alist b{display:block;font-size:19px}
.alist small{font:15px/1.5 'JetBrains Mono',monospace;color:var(--mute)}
.alist p{margin:6px 0 0;font-size:17px}
.empty{margin:14px 0 0;padding:16px;border-radius:20px;background:var(--bg);font-size:17px}
.sec a{color:inherit}
select{font:600 18px Archivo,sans-serif;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:14px;font:16px 'JetBrains Mono',monospace}
th,td{padding:11px 10px;text-align:right;border-bottom:1.5px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-family:Archivo,sans-serif}
th{color:var(--mute);font-weight:600}
tbody tr{cursor:pointer}
tbody tr.on{background:var(--bg)}
tbody tr.on td:first-child{font-weight:800}
td small{color:var(--drop)}
.verdict{font-size:18px;margin:14px 0 0;max-width:62ch}
.reader h2,.sec h2{font:800 24px/1.1 Archivo,sans-serif;margin:0}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:4px}
.seg .btn{border:0;background:transparent;min-height:38px}
.seg .btn[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.rows{font:16px/1 'JetBrains Mono',monospace;display:grid;gap:2px}
.row{display:flex;align-items:baseline;gap:8px;padding:9px 14px}
.row i{flex:1;border-bottom:1.5px dotted var(--line);transform:translateY(-3px)}
.row b{font-weight:600;white-space:nowrap}
.row.hi{background:var(--ink);color:var(--bg);border-radius:999px}
.row.hi i{border-color:transparent}
.fig{position:relative;height:150px;margin:14px 0 4px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;background:transparent;height:44px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:9px;background:var(--line)}
input[type=range]::-moz-range-track{height:10px;border-radius:9px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--ink);border:4px solid var(--card);margin-top:-10px;box-shadow:0 2px 6px #0004}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--ink);border:4px solid var(--card)}
.now{margin-top:6px}
.sec{margin-top:18px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:14px}
.day{all:unset;cursor:pointer;text-align:center;padding:12px 4px;border-radius:22px;display:grid;gap:4px;justify-items:center}
.day:hover,.day.sel{background:var(--bg)}
.day:focus-visible{outline:3px solid var(--acc)}
.day small{font:600 15px 'JetBrains Mono',monospace;color:var(--mute)}
.day svg{width:44px;height:36px}
.day b{font:400 30px/1 Anton,sans-serif}
.day span{font:400 22px/1 Anton,sans-serif;color:var(--mute)}
.day em{font:600 15px 'JetBrains Mono',monospace;color:var(--drop);font-style:normal}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px}
.tile{display:flex;flex-direction:column;gap:10px;min-height:230px}
.tile h3{font:800 18px Archivo,sans-serif;margin:0;color:var(--mute)}
.big{font:400 clamp(44px,6vw,64px)/.95 Anton,Impact,sans-serif;text-transform:uppercase}
.small{font:16px/1.5 'JetBrains Mono',monospace;color:var(--mute)}
.meter{height:14px;border-radius:9px;background:var(--line);overflow:hidden}
.meter>div{height:100%;border-radius:9px;background:var(--ink);transition:width .3s}
.uvbar{height:14px;border-radius:9px;background:linear-gradient(90deg,#6cc04a,#f5d33a,#f59a23,#e8432e,#9b4bd6);position:relative}
.uvbar>div{position:absolute;top:-5px;width:6px;height:24px;border-radius:3px;background:var(--ink);transform:translateX(-50%);transition:left .3s}
.tile svg{display:block}
.note{font-size:15px;color:var(--mute);margin:20px 4px 0}
footer{font-size:15px;color:var(--mute);margin:8px 4px 0}
footer a{color:inherit}
.drift{animation:drift var(--dt,8s) ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
.dr{animation:fall var(--t,1s) linear infinite}
@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(78px);opacity:0}}
.sn{animation:snow var(--t,3s) linear infinite}
@keyframes snow{0%{transform:translate(0,-10px);opacity:0}20%{opacity:1}50%{transform:translate(6px,35px)}100%{transform:translate(-4px,80px);opacity:0}}
.bolt{animation:flash 3.2s steps(1) infinite}
@keyframes flash{0%,100%{opacity:0}8%,14%{opacity:1}11%{opacity:0}}
.fog{animation:drift 6s ease-in-out infinite alternate}
.float{animation:float 5s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(-3px)}to{transform:translateY(4px)}}
.squish{animation:squish .5s ease}
@keyframes squish{30%{transform:scale(1.08,.9)}60%{transform:scale(.95,1.06)}}
.squish,.float,.drift{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.tiles{grid-template-columns:minmax(0,1fr)}.week{grid-template-columns:repeat(7,minmax(64px,1fr));overflow-x:auto;scroll-snap-type:x mandatory}.day{scroll-snap-align:start}.cond{text-align:left}.tile{min-height:0}.card{border-radius:26px}}
</style>
</head>
<body>
<button class="mini" id="mini" aria-hidden="true" tabindex="-1">
  <span class="mi-ic" id="miIc"></span>
  <span class="mi-tx"><b id="miPlace"></b><small id="miCond"></small></span>
  <span class="mi-t" id="miTemp"></span>
  <span class="mi-al" id="miAl" hidden></span>
</button>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sh-in">
    <div class="sh-top"><h2 id="shTitle">Mis lugares</h2><div class="sh-btns"><button class="btn" id="editBtn" aria-pressed="false">Editar</button><button class="btn" id="closeSheet">Listo</button></div></div>
    <form id="addForm" class="addf"><input id="addQ" type="search" placeholder="Añadir un lugar…" autocomplete="off" aria-label="Añadir lugar"><button class="btn" type="submit">Buscar</button></form>
    <div class="chips" id="addRes"></div><p class="msg" id="addMsg"></p>
    <div class="cards" id="cards"></div>
    <h3 class="sh-h3">Aspecto</h3>
<div class="skins" role="group" aria-label="Piel">
      <button class="btn" data-skin="arcilla">Arcilla</button>
      <button class="btn" data-skin="noche">Noche</button>
      <button class="btn" data-skin="verbena">Verbena</button>
    </div>
  </div>
</div>
<div class="wrap">
  <header>
    <button class="place" id="placeBtn" aria-expanded="false" aria-controls="panel"><span id="placeName">Bilbao</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
    <button class="btn addhere" id="addHere" hidden>＋ Añadir</button>
    <button class="btn locbtn" id="listBtn" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="3.5" cy="6" r="1.3" fill="currentColor"/><circle cx="3.5" cy="12" r="1.3" fill="currentColor"/><circle cx="3.5" cy="18" r="1.3" fill="currentColor"/></svg>Mis lugares</button>
    <button class="btn locbtn2" id="locBtn" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Mi ubicación</button>
    <p class="locmsg" id="locMsg" role="status"></p>

  </header>

  <div class="panel" id="panel" hidden>
    <form id="searchForm">
      <input id="q" type="search" placeholder="Busca un pueblo o ciudad…" autocomplete="off" aria-label="Buscar lugar">
      <button class="btn" type="submit">Buscar</button>
      <button class="btn" type="button" id="geoBtn">Mi ubicación</button>
    </form>
    <div class="chips" id="results"></div>
    <p class="msg" id="searchMsg"></p>
  </div>

  <div class="grid">
    <section class="card hero" aria-label="Tiempo ahora">
      <div class="htop">
        <div>
          <div class="temp" id="temp">--<sup>°</sup></div>
          <div class="when" id="when"></div>
        </div>
        <div class="cond"><b id="condTxt">…</b><span id="hiLo"></span></div>
      </div>
      <div class="alerts" id="alerts"></div>
      <svg class="scene" id="scene" viewBox="0 0 400 352" role="img" aria-label="Ilustración del tiempo"></svg>
      <div class="bubble" id="bubble"></div>
    </section>

    <section class="card reader" aria-label="Hora a hora">
      <div class="rhead">
        <h2>Hora a hora</h2>
        <div class="seg" role="group" aria-label="Rango">
          <button class="btn" id="mDia" aria-pressed="true">Día</button>
          <button class="btn" id="mSem" aria-pressed="false">Semana</button>
        </div>
      </div>
      <div class="rows" id="rows"></div>
      <div class="fig"><svg id="chart" aria-hidden="true"></svg></div>
      <input type="range" id="scrub" min="0" max="23" value="0" aria-label="Elegir hora">
      <button class="btn now" id="nowBtn">Volver a ahora</button>
    </section>
  </div>

  <section class="card sec" id="avisos" aria-label="Avisos oficiales"></section>

  <section class="card sec" aria-label="Próximos días">
    <h2>Próximos 7 días</h2>
    <div class="week" id="week"></div>
  </section>

  <section class="card sec" aria-label="Modelos">
    <div class="shead">

const keyOf=p=>p.geo?'geo':(+p.lat).toFixed(2)+','+(+p.lon).toFixed(2);
let PLACES=[];try{PLACES=store.get('w.places')}catch(e){}if(!Array.isArray(PLACES)||!PLACES.length)PLACES=[{name:place.name,lat:place.lat,lon:place.lon,prov:place.prov||null,cc:place.cc||null,geo:!!place.geo}];
const saveP=()=>store.set('w.places',PLACES);
const inList=p=>PLACES.some(q=>keyOf(q)===keyOf(p));
function upsert(p,top){const k=keyOf(p),i=PLACES.findIndex(q=>keyOf(q)===k),e={name:p.name,lat:p.lat,lon:p.lon,prov:p.prov||null,cc:p.cc||null,geo:!!p.geo};
  if(i>=0)PLACES[i]=e;else if(top)PLACES.unshift(e);else PLACES.push(e);saveP()}
function syncAddHere(){$('addHere').hidden=inList(place)}
$('addHere').addEventListener('click',()=>{upsert(place);syncAddHere()});
const SUM={};
const TINT={clear:'var(--sun)',partly:'var(--sun)',cloudy:'var(--c2)',fog:'var(--mute)',drizzle:'var(--drop)',rain:'var(--drop)',snow:'#bcd6ff',storm:'var(--warn)'};
function cardHTML(p,j){
  const sm=SUM[keyOf(p)],k=sm?KIND(sm.code):null,cur=keyOf(p)===keyOf(place);
  const tint=sm?`color-mix(in srgb,var(--card) ${sm.day?78:70}%,${sm.day?TINT[k]:'#1b2440'})`:'var(--card)';
  const al=sm&&sm.al&&sm.al[0];const sh=t=>{const m=/aviso de (.+?) de nivel (\w+)/i.exec(t);return m?m[2][0].toUpperCase()+m[2].slice(1)+': '+m[1]:t};
  return `<div class="pc${cur?' cur':''}" data-k="${esc(keyOf(p))}"><button class="pcard" data-j="${j}" style="--tint:${tint}" aria-label="${esc(p.name)}${sm?`, ${r0(sm.temp)} grados, ${esc(TXT[sm.code]||'')}`:''}">
    <span class="pc-n">${esc(p.name)}</span>
    <span class="pc-t">${sm?icon(sm.code,!sm.day)+r0(sm.temp)+'°':'<span style="font-size:24px;opacity:.5">…</span>'}</span>
    <span class="pc-s">${p.geo?`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/></svg>Mi ubicación`:esc(String(p.prov||'').split('+').map(x=>PNAME[x]||x).join(' · ')||'—')}</span>
    <span class="pc-c">${sm?esc(TXT[sm.code]||''):''}</span><span class="pc-h">${sm?`Máx ${r0(sm.max)}° · Mín ${r0(sm.min)}°`:''}</span>
    ${al?`<span class="pc-a lv${al.level}" style="background:${LVC[al.level]}">⚠ ${esc(sh(al.title))}${sm.al.length>1?` (+${sm.al.length-1})`:''}</span>`:''}
  </button><div class="pc-ed"><button data-mv="-1" data-j="${j}" aria-label="Subir ${esc(p.name)}">↑</button><button data-mv="1" data-j="${j}" aria-label="Bajar ${esc(p.name)}">↓</button><button class="del" data-del="${j}" aria-label="Quitar ${esc(p.name)}">✕</button></div></div>`;
}
function renderCards(){$('cards').innerHTML=PLACES.map(cardHTML).join('')||'<p class="empty">Todavía no tienes lugares. Añade uno arriba.</p>'}
async function loadSummaries(){
  const live=D&&D.live;let all=null;
  if(live){try{all=await feed()}catch(e){}}
  if(live){try{const la=PLACES.map(p=>p.lat).join(','),lo=PLACES.map(p=>p.lon).join(',');
      let j=await fetchT(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1&models=${model}`,8000);
      if(!Array.isArray(j))j=[j];
      j.forEach((r,i)=>{const p=PLACES[i];if(!p||!r.current)return;SUM[keyOf(p)]={temp:r.current.temperature_2m,code:r.current.weather_code??3,day:r.current.is_day,max:r.daily.temperature_2m_max[0],min:r.daily.temperature_2m_min[0],al:all&&(!p.cc||p.cc==='ES')?alertsFor(p,all):[]}})}catch(e){}}
  else PLACES.forEach(p=>{const sd=sample(p),i=Math.max(0,sd.h.t.findIndex(t=>t.slice(0,13)===sd.now));SUM[keyOf(p)]={temp:sd.h.temp[i],code:sd.h.code[i],day:sd.h.day[i],max:sd.d.max[0],min:sd.d.min[0],al:sampleAlerts(p)}});
  if(!$('sheet').hidden)renderCards();
}
let lastFocus=null;
function openSheet(){lastFocus=document.activeElement;$('sheet').hidden=false;document.body.style.overflow='hidden';$('sheet').scrollTop=0;renderCards();loadSummaries();$('closeSheet').focus();checkMini()}
function closeSheet(){$('sheet').hidden=true;document.body.style.overflow='';$('sheet').classList.remove('editing');$('editBtn').setAttribute('aria-pressed','false');$('editBtn').textContent='Editar';if(lastFocus)lastFocus.focus();requestAnimationFrame(checkMini)}
$('listBtn').addEventListener('click',openSheet);
$('closeSheet').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet()});
$('editBtn').addEventListener('click',()=>{const on=$('sheet').classList.toggle('editing');$('editBtn').setAttribute('aria-pressed',on);$('editBtn').textContent=on?'Hecho':'Editar'});
$('cards').addEventListener('click',e=>{
  const mv=e.target.closest('[data-mv]'),del=e.target.closest('[data-del]'),c=e.target.closest('.pcard');
  if(mv){const j=+mv.dataset.j,t=j+ +mv.dataset.mv;if(t<0||t>=PLACES.length)return;[PLACES[j],PLACES[t]]=[PLACES[t],PLACES[j]];saveP();renderCards();return}
  if(del){PLACES.splice(+del.dataset.del,1);saveP();renderCards();syncAddHere();return}
  if(c&&!$('sheet').classList.contains('editing')){const p=PLACES[+c.dataset.j];closeSheet();go(p).then(()=>{if(p.geo)locate(true)})}
});
$('addForm').addEventListener('submit',async e=>{e.preventDefault();const q=$('addQ').value.trim();if(!q)return;$('addMsg').textContent='Buscando…';
  const show=l=>{$('addRes').innerHTML=l.map((p,j)=>`<button class="btn" data-j="${j}">＋ ${esc(p.name)}${p.sub?` <span style="opacity:.6">· ${esc(p.sub)}</span>`:''}</button>`).join('');$('addRes')._list=l};
  try{const j=await fetchT(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=es`,6000);
    const l=(j.results||[]).map(r=>({name:r.name,sub:[r.admin2||r.admin1,r.country].filter(Boolean).join(', '),lat:r.latitude,lon:r.longitude,cc:r.country_code,prov:r.country_code==='ES'?provOf(r.admin2||r.admin1):null}));
    show(l);$('addMsg').textContent=l.length?'Toca el que quieras añadir.':'No he encontrado ese lugar.'}
  catch(err){const n=nrm(q),l=PRESETS.filter(p=>nrm(p.name).includes(n));show(l.length?l:PRESETS);$('addMsg').textContent='Sin conexión con el buscador: elige uno de estos (en GitHub Pages podrás buscar cualquier sitio).'}});
$('addRes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const p=$('addRes')._list[+b.dataset.j];upsert(p);$('addRes').innerHTML='';$('addQ').value='';$('addMsg').textContent=`${p.name} añadido.`;syncAddHere();renderCards();loadSummaries()});
$('miAl').addEventListener('click',e=>{e.stopPropagation();(OFF.list.length?$('avisos'):document.querySelector('.hero')).scrollIntoView({behavior:'smooth',block:'start'})});
mini.addEventListener('click',()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));
$('geoBtn').addEventListener('click',()=>{$('panel').hidden=true;$('placeBtn').setAttribute('aria-expanded','false');locate(false)});
async function go(p){place={name:p.name,lat:p.lat,lon:p.lon,prov:p.prov||null,cc:p.cc||null,geo:!!p.geo};store.set('w.place',place);$('placeName').textContent=place.name;$('locBtn').setAttribute('aria-pressed',place.geo);if(place.geo)upsert(place,true);syncAddHere();$('panel').hidden=true;$('placeBtn').setAttribute('aria-expanded','false');$('searchMsg').textContent='';taps=0;
  OFF={status:'loading',list:[]};await load(place);idx=-1;renderAll();await Promise.all([loadOfficial(place),loadCompare(place)]);renderAlerts();renderOfficial();renderModels()}
$('modelSel').addEventListener('change',async e=>{model=e.target.value;store.set('w.model',model);$('verdict').textContent='Cargando…';const keep=idx-start;await load(place);setRange();idx=Math.min(start+keep,start+ +$('scrub').max);$('scrub').value=idx-start;renderHero();renderAlerts();renderRows();drawChart();renderWeek();renderTiles();renderModels()});
$('cmp').addEventListener('click',e=>{const r=e.target.closest('tr[data-m]');if(!r)return;$('modelSel').value=r.dataset.m;$('modelSel').dispatchEvent(new Event('change'))});
/* arranque: si la última vez usaste tu ubicación (o es la primera visita), la vuelve a pedir */
(async()=>{
  const first=!store.get('w.place');let granted=false;
  try{granted=(await navigator.permissions.query({name:'geolocation'})).state==='granted'}catch(e){}
  await go(place);checkMini();
  if(place.geo||first||granted)locate(true);
})();
}
</script>
